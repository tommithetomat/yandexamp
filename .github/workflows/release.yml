name: Build & Release

# Pushing a tag vX.Y.Z builds the installers and publishes a GitHub release;
# the tag's annotation becomes the release notes. A manual run (Actions →
# Build & Release → Run workflow) builds the same installers as workflow
# artifacts only, without releasing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --bundles dmg --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # The legacy 1.x Electron app is still a devDependency; its binary isn't needed
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version $ver"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npx tauri build ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            [ -e "$f" ] && cp "$f" "out/YandexAmp-$ver-Windows-Setup.exe"
          done
          for f in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            [ -e "$f" ] && cp "$f" "out/YandexAmp-$ver-macOS-universal.dmg"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  # One job publishes ONE release with both installers
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release notes from the tag annotation
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: installers

      - uses: softprops/action-gh-release@v2
        with:
          name: YandexAmp ${{ github.ref_name }}
          body_path: notes.md
          files: installers/*
